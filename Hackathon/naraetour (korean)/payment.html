<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제하기 | 나래투어</title>
    <link rel="stylesheet" href="narae.design.css">
    <link rel="icon" type="image/png"   href="Narae Tour (No Text) (1).png">
</head>
<body>
    <header>    
        <div class="narae-logo">
            <img src="Narae Tour (No Text) (1).png" alt="Narae Logo" srcset="" class="naraelogo">
            <ul>
                <li><a href="narae.html">홈</a></li>
                <li><a href="paket tour.html">투어 패키지</a></li>
                <li><a href="benefit.html">나래의 장점</a></li>
                <li><a href="paket tour.html" class="active">투어 가자!</a></li>
            </ul>
        </div>
    </header>
    <main>
        <div class="payment-hero">
            <h1>결제하기</h1>
            <p>아래 정보를 확인하고 결제를 완료해 주세요.</p>
        </div>

        <div class="payment-content">
            <div class="payment-summary">
                <h2>패키지 정보</h2>
                <p class="summary-paket">패키지: <span id="nama-paket">이슬라믹 투어</span></p>
                <p class="summary-harga">금액: <span id="harga-paket">320,000원</span></p>
            </div>

            <div class="payment-method">
                <h2>결제 방법</h2>
                <div class="method-options">
                    <button class="method-btn active-method">계좌이체</button>
                    <button class="method-btn">신용카드</button>
                </div>

                <div class="transfer-info">
                    <p>입금 계좌: <strong>토스뱅크 1908-1234-5678</strong></p>
                    <p>예금주: <strong>나래투어</strong></p>
                    <p>입금 금액: <strong id="transfer-price">320,000원</strong></p>
                </div>
                <div class="card-info" style="display:none;">
            <div class="card-form">
                <label>카드 번호</label>
                <input type="text" class="card-input" placeholder="1234 5678 9012 3456" maxlength="19">
                
                <div class="card-row">
                    <div>
                        <label>유효기간</label>
                        <input type="text" class="card-input" placeholder="MM/YY" maxlength="5">
                    </div>
                    <div>
                        <label>CVC</label>
                        <input type="text" class="card-input" placeholder="123" maxlength="3">
                    </div>
                </div>

                <label>카드 소유자 이름</label>
                <input type="text" class="card-input" placeholder="홍길동">
            </div>
        </div>
        <a href="itinerary.html" class="pay-btn">결제 완료 →</a>
        <div class="popup-overlay" id="popup-overlay"> <!-- 결체 팝업 창-->
        <div class="popup">
            <h2>🎉 결제 완료! ✅</h2>
            <p>예약해 주셔서 감사합니다.</p>
            <div class="popup-invoice">
                <p>패키지: <strong id="popup-paket"></strong></p>
                <p>금액: <strong id="popup-harga"></strong></p>
                <p>결제 방법: <strong id="popup-method"></strong></p>
            </div>
            <button class="popup-close" id="popup-close">이티너러리 확인하기 →</button>
        </div>
    </div>
    </main>
</body>
<script src="index.js"></script>
</html>
