<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <link rel="stylesheet" href="signlog_design.css">
</head>
<body>
    <header>
        <h1>Sign Up!</h1>
    </header>
    <div class="form-container">
        <form action="">
            <div class="field">
                <label for="name">이름</label>
                <input type="text" name="username" id="name">
            </div>
            <div class="field">
                <label for="id">아이디</label>
                <input type="text" name="userid" id="id">
            </div>
            <div class="field">
                <label for="pw">비밀번호</label>
                <input type="password" name="userpw" id="pw">
            </div>
            <div class="field">
                <label for="pwcheck">비밀번호 확인</label>
                <input type="password" name="userpwcheck" id="pwcheck">
            </div>
            <div class="field checkbox-field">
                <label for="perm">개인정보 수집 및 이용 동의</label>
                <input type="checkbox" name="userperm" id="perm">
            </div>
            <button type="submit" class="signed">가입하기</button>
        </form>
    </div>
    <script src="signlog_mechanism.js"></script>
</body>
</html>
